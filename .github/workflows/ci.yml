name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run lint
        run: ruff check src tests --ignore LOG015,TRY004
      - name: Run fixture-only reduced pipeline check
        run: pytest -q tests/test_data_quality.py
      - name: Run safe fixture pipeline
        run: python scripts/run_fixture_pipeline.py
